<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Image to Video</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    input[type="file"],
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 15px;
    }

    textarea {
      height: 100px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: none;
      font-size: 15px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    #preview {
      max-width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      display: none;
    }

    #videoSection {
      display: none;
      margin-top: 25px;
    }

    #resultVideo {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
      background: #000;
    }

    #downloadBtn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 AI Image to Video</h1>

    <p>Image upload karo aur video ka movement likho</p>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <img
      id="preview"
      alt="Image Preview"
    >

    <textarea
      id="prompt"
      placeholder="Video Prompt likho..."
    ></textarea>

    <button id="generateBtn">
      🎬 Generate Video
    </button>

    <div id="status">
      Ready
    </div>

    <div id="videoSection">

      <h2>🎉 Your Video</h2>

      <video
        id="resultVideo"
        controls
        playsinline
      ></video>

      <a
        id="downloadBtn"
        download="ai-video.mp4"
      >
        ⬇️ Download Video
      </a>

    </div>

  </div>


  <script>

    const imageInput =
      document.getElementById("imageInput");

    const promptInput =
      document.getElementById("prompt");

    const generateBtn =
      document.getElementById("generateBtn");

    const statusText =
      document.getElementById("status");

    const preview =
      document.getElementById("preview");

    const videoSection =
      document.getElementById("videoSection");

    const resultVideo =
      document.getElementById("resultVideo");

    const downloadBtn =
      document.getElementById("downloadBtn");


    // Image preview
    imageInput.addEventListener("change", () => {

      const image = imageInput.files[0];

      if (!image) return;

      preview.src =
        URL.createObjectURL(image);

      preview.style.display =
        "block";

      videoSection.style.display =
        "none";

      statusText.innerText =
        "Image ready ✅";
    });


    // Generate video
    generateBtn.addEventListener("click", async () => {

      const image =
        imageInput.files[0];

      const prompt =
        promptInput.value.trim();


      if (!image) {

        statusText.innerText =
          "❌ Pehle image select karo.";

        return;
      }


      generateBtn.disabled =
        true;

      videoSection.style.display =
        "none";

      statusText.innerText =
        "⏳ Video generation शुरू हो रही है...";


      const formData =
        new FormData();


      formData.append(
        "image",
        image
      );


      formData.append(
        "prompt",
        prompt ||
        "Smooth natural motion"
      );


      try {

        const response =
          await fetch(
            "/generate-video",
            {
              method: "POST",
              body: formData
            }
          );


        const data =
          await response.json();


        console.log(
          "Server response:",
          data
        );


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Video generation failed"
          );

        }


        // Video URL received
        if (!data.videoUrl) {

          throw new Error(
            "Video URL नहीं मिला"
          );

        }


        statusText.innerText =
          "✅ Video ready!";


        resultVideo.src =
          data.videoUrl;


        downloadBtn.href =
          data.videoUrl;


        videoSection.style.display =
          "block";


        generateBtn.disabled =
          false;


      } catch (error) {

        console.error(error);


        statusText.innerText =
          "❌ Error: " +
          error.message;


        generateBtn.disabled =
          false;
      }

    });

  </script>

</body>
</html>
