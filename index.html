<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image to Video</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    input[type="file"],
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 15px;
    }

    textarea {
      height: 100px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: none;
      font-size: 15px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    #preview {
      max-width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 AI Image to Video</h1>

    <p>Image upload karo aur video ka movement likho</p>

    <input type="file" id="imageInput" accept="image/*">

    <img id="preview" alt="Image Preview">

    <textarea
      id="prompt"
      placeholder="Video Prompt likho..."
    ></textarea>

    <button id="generateBtn">
      🎬 Generate Video
    </button>

    <div id="status">
      Ready
    </div>

  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const promptInput = document.getElementById("prompt");
    const generateBtn = document.getElementById("generateBtn");
    const statusText = document.getElementById("status");
    const preview = document.getElementById("preview");

    // Image preview
    imageInput.addEventListener("change", () => {
      const image = imageInput.files[0];

      if (image) {
        preview.src = URL.createObjectURL(image);
        preview.style.display = "block";
        statusText.innerText = "Image ready ✅";
      }
    });

    // Generate video
    generateBtn.addEventListener("click", async () => {

      const image = imageInput.files[0];
      const prompt = promptInput.value.trim();

      if (!image) {
        statusText.innerText = "❌ Pehle image select karo.";
        return;
      }

      statusText.innerText = "⏳ Video generate ho raha hai...";
      generateBtn.disabled = true;

      const formData = new FormData();

      formData.append("image", image);
      formData.append(
        "prompt",
        prompt || "Smooth natural motion"
      );

      try {

        const response = await fetch("/generate-video", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Video generation failed"
          );
        }

        statusText.innerText =
          "✅ Video generation started! Project ID: " +
          data.projectId;

        console.log(data);

      } catch (error) {

        console.error(error);

        statusText.innerText =
          "❌ Error: " + error.message;

      } finally {

        generateBtn.disabled = false;

      }
    });
  </script>

</body>
</html>
