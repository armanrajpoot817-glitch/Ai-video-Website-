<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Image to Video</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

.container {
    width: 92%;
    max-width: 500px;
    margin: 40px auto;
    padding: 25px;
    background: #1f2937;
    border-radius: 20px;
}

h1 {
    text-align: center;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    color: #b8c1cc;
}

label {
    display: block;
    margin-top: 22px;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="file"],
textarea {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #4b5563;
    background: #111827;
    color: white;
}

textarea {
    height: 110px;
    resize: none;
}

#preview {
    width: 100%;
    margin-top: 15px;
    border-radius: 12px;
    display: none;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #7c3aed;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

#status {
    text-align: center;
    margin-top: 18px;
    color: #c4b5fd;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎬 AI Image to Video</h1>

    <p class="subtitle">
        Image upload karo aur video ka movement likho
    </p>

    <label>📷 Image चुनें</label>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <img id="preview">

    <label>✍️ Video Prompt</label>

    <textarea
        id="prompt"
        placeholder="Example: Camera slowly moves forward, natural movement, realistic video..."
    ></textarea>

    <button onclick="generateVideo()">
        🎬 Generate Video
    </button>

    <div id="status"></div>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const statusText = document.getElementById("status");

imageInput.addEventListener("change", function() {

    const file = this.files[0];

    if (file) {

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";

        statusText.innerText = "Image ready ✅";
    }

});

function generateVideo() {

    const image = imageInput.files[0];

    const prompt = document.getElementById("prompt").value.trim();

    if (!image) {
        statusText.innerText = "❌ Pehle image upload karo.";
        return;
    }

    if (!prompt) {
        statusText.innerText = "❌ Video ka prompt likho.";
        return;
    }

    statusText.innerText =
        "⏳ AI video generation system connect kiya jayega...";

}

</script>

</body>
</html>
